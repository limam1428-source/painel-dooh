<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Rumo ao Hexa</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:600px;
    height:40px;

    overflow:hidden;

    background:#000;

    font-family:Arial, sans-serif;

}

/* PAINEL */

.painel{

    width:600px;
    height:40px;

    overflow:hidden;

    position:relative;

    background:linear-gradient(
        90deg,
        #002776,
        #009739,
        #FFDF00
    );

}

/* TEXTO */

.texto{

    position:absolute;

    display:flex;

    align-items:center;

    gap:18px;

    white-space:nowrap;

    font-size:24px;

    font-weight:bold;

    top:4px;

    animation:rolar 8s linear infinite;

    text-shadow:
        0 0 5px currentColor,
        0 0 10px currentColor;

}

/* BANDEIRA */

.bandeira{

    width:36px;

    height:auto;

    animation:vento 1s ease-in-out infinite;

    transform-origin:left center;

    filter:
        drop-shadow(0 0 4px #FFF);

}

/* EFEITO VENTO */

@keyframes vento{

    0%{

        transform:
            skewY(0deg)
            rotate(0deg);

    }

    25%{

        transform:
            skewY(4deg)
            rotate(2deg);

    }

    50%{

        transform:
            skewY(0deg)
            rotate(0deg);

    }

    75%{

        transform:
            skewY(-4deg)
            rotate(-2deg);

    }

    100%{

        transform:
            skewY(0deg)
            rotate(0deg);

    }

}

/* CORES */

.copa{

    color:#FFDF00;

}

.hexa{

    color:#FFFFFF;

}

.dias{

    color:#00FF66;

}

.brasil{

    color:#00BFFF;

}

/* Ajustado para alinhar as duas metades sem espaço entre elas */
.urb{
    display: inline-flex;
}

.urb-branco {
    color: #FFFFFF;
}

.urb-azul {
    color: #0000FF;
}

.eletro{

    color:#FFA500;

}

.Ubnews{

    color:#0066FF;

}



/* TEXTO ROLANDO */

@keyframes rolar{

    from{

        transform:translateX(600px);

    }

    to{

        transform:translateX(-1800px);

    }

}

</style>

</head>

<body>

<div class="painel">

<div class="texto">

<!-- BANDEIRA -->

<img
    src="https://upload.wikimedia.org/wikipedia/en/0/05/Flag_of_Brazil.svg"
    class="bandeira"
>

<!-- TEXTO -->

<span class="copa">
⚽ COPA 2026
</span>

<span class="hexa">
RUMO AO HEXA
</span>

<span class="dias" id="dias">
FALTAM 000 DIAS
</span>

<span class="brasil">
BRASIL 2026
</span>


</div>

</div>

<script>

function atualizar(){

    const hoje =
        new Date();

    const copa =
        new Date("2026-06-12");

    const diferenca =
        copa - hoje;

    const dias =
        Math.floor(
            diferenca /
            (1000 * 60 * 60 * 24)
        );

    document.getElementById("dias")
        .innerText =
        `FALTAM ${dias} DIAS`;

}

setInterval(atualizar,60000);

atualizar();

</script>

</body>

</html>
